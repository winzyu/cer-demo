<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gilligan — water quality assistant</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- No dark mode: the product has none. See theme.css. -->
  <meta name="color-scheme" content="light">

  <link rel="preload" href="vendor/fonts/work-sans-v24-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/poppins-v24-latin-600.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <header class="appbar">
      <img class="appbar__logo" src="assets/cer-dark-transparent.png" alt="Clean Earth Rovers">
      <span class="appbar__title">Gilligan</span>
      <span class="appbar__spacer"></span>
      <!-- Health text from api.js. -->
      <span class="appbar__meta" id="health"></span>
    </header>

    <div class="layout">
      <!--
        Left column — session controls, not the transcript. Owned by js/podbar.js (device) and
        js/accountbar.js (demo account). These are constant across answers, so they live in the chrome rather than repeating
        per message.
      -->
      <div class="col-left">
        <section class="panel-group">
          <span class="panel-label">Device</span>
          <select class="podpicker__select" id="pod-select" disabled>
            <option value="">Loading devices…</option>
          </select>
          <!-- podbar.js renders status / mismatch badges here -->
          <div id="pod-status"></div>
        </section>

        <!--
          Demo-only scaffolding: which credential this page talks to the API with. Kept working,
          styled quiet — a real deployment authenticates once, not through a token picker. A
          native <details> so it can be collapsed out of the way without any JS.
        -->
        <details class="panel-group panel-group--quiet" id="account-group" open>
          <summary class="panel-label">Demo account</summary>
          <label class="podpicker" for="account-select">
            <span class="podpicker__label">Account</span>
            <select class="podpicker__select" id="account-select">
              <option value="">Signed out</option>
            </select>
          </label>
          <button type="button" class="btn--ghost" id="account-forget">Forget</button>

          <!-- Hidden until "Add an account…" is chosen, or the pod bar's signed-out badge is clicked. -->
          <div class="accountform" id="account-panel" hidden>
            <label class="accountform__field" for="account-name">
              <span class="podpicker__label">Label</span>
              <input class="accountform__input" id="account-name" type="text"
                     placeholder="e.g. Superadmin, or Harbor QA" autocomplete="off">
            </label>
            <label class="accountform__field accountform__field--wide" for="account-token">
              <span class="podpicker__label">Bearer token</span>
              <input class="accountform__input" id="account-token" type="password"
                     placeholder="Paste the JWT — dashboard DevTools → Local Storage → token"
                     autocomplete="off" spellcheck="false">
            </label>
            <button type="button" class="btn--ghost" id="account-save">Save &amp; use</button>
            <button type="button" class="btn--ghost" id="account-cancel">Cancel</button>
            <span class="accountform__hint" id="account-hint"></span>
          </div>
        </details>

        <!-- Chat history will render here once conversations persist. No backing store yet, so
             no placeholder UI: an empty rail pretending to be a feature would be worse than
             nothing. -->
      </div>

      <div class="col-right">
        <!--
          Message list. Every message element is built by js/render.js, which gives each one
          these named slots so Wave 1 streams can mount into a message without editing this file:

            <div class="msg {user|assistant}">
              <div class="role">…</div>                                 (hidden by CSS)
              <div class="body"        data-slot="body">…</div>          WS-1 markdown target
              <div class="provenance"  data-slot="provenance"></div>     WS-2, assistant only
              <div class="chart"       data-slot="chart"></div>          WS-4, assistant only
              <div class="report"      data-slot="report"></div>         generate_report link, assistant only
              …citations appended here by renderCitations()

          The provenance, chart, and report slots start empty and are absent from user messages.
          Empty slots are display:none, so they cost no space until something mounts.

          Class vocabulary lives in app.css — .chip / .chip--tool / .chip--deduped /
          .badge--ok / .badge--warn / .notice--error / .chart__* / .btn--ghost / .btn--report.
          Use those names rather than new ones, and never a literal colour.

          Provenance collapses into <details class="details"> (closed by default). Only
          answer-specific caveats stay loose in the slot.
        -->
        <div id="messages" aria-live="polite">
          <!-- Static greeting, not built by render.js. `data-greeting` keeps it out of input.js's
               "last answer" lookup, so Copy answer never copies it. -->
          <div class="msg assistant" data-role="assistant" data-greeting>
            <div class="role">assistant</div>
            <div class="body" data-slot="body">Hi I&rsquo;m Gilligan&trade;, your AI water quality assistant. Feel free to ask me anything about your waters!</div>
          </div>
        </div>

        <!-- Input / controls region. js/input.js owns everything inside it except the composer form. -->
        <div id="input-region">
          <form id="composer">
            <input type="text" id="input" placeholder="Ask about a reading, a threshold, or a site…" autocomplete="off" autofocus required>
            <span class="composer__hint">Shift + Enter for a new line</span>
            <button type="submit" id="send" aria-label="Send">Send</button>
          </form>

          <!-- Response controls: stop / copy / regenerate. Empty today. -->
          <div id="response-controls"></div>
        </div>
      </div>
    </div>
  </div>

  <!--
    ES modules. NOTE: module scripts are fetched with CORS, and a file:// page has an
    opaque origin, so browsers block them. Serve this directory over HTTP to open it,
    e.g. `python3 -m http.server 5173` from frontend/ then http://localhost:5173/.
  -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
