<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clean Earth RAG</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { color-scheme: light dark; --border:#d6d6d6; --muted:#666; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline; gap: 12px;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .meta { color: var(--muted); font-size: 12px; }
    #messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg { max-width: 720px; }
    .msg.user { align-self: flex-end; }
    .msg.assistant { align-self: flex-start; }
    .msg .role { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
    .msg .body { white-space: pre-wrap; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .msg.user .body { background: rgba(0,80,200,0.06); }
    .citations { font-size: 12px; color: var(--muted); margin-top: 6px; padding-left: 0; list-style: none; }
    .citations li { margin: 2px 0; }
    .citations .file { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .thinking { font-size: 12px; color: var(--muted); padding: 4px 8px; }
    form { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); }
    input[type=text] { flex: 1; padding: 8px 10px; font: inherit; border: 1px solid var(--border); border-radius: 6px; }
    button { padding: 8px 14px; font: inherit; border: 1px solid var(--border); border-radius: 6px; background: rgba(0,0,0,0.04); cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: progress; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <header>
    <h1>Clean Earth RAG</h1>
    <span class="meta">single-sensor water-quality assistant</span>
    <span class="meta" id="health"></span>
  </header>

  <div id="messages" aria-live="polite"></div>

  <form id="composer">
    <input type="text" id="input" placeholder="Ask about your water…" autocomplete="off" autofocus required>
    <button type="submit" id="send">Send</button>
  </form>

  <script>
    const BACKEND = (new URLSearchParams(location.search)).get("backend") || "http://localhost:8000";

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const healthEl = document.getElementById("health");
    const history = []; // [{role, content}]

    function renderMessage(role, body, citations) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;
      const r = document.createElement("div"); r.className = "role"; r.textContent = role;
      const b = document.createElement("div"); b.className = "body"; b.textContent = body;
      wrap.append(r, b);
      if (citations && citations.length) {
        const seen = new Set();
        const ul = document.createElement("ul"); ul.className = "citations";
        for (const c of citations) {
          if (seen.has(c.filename)) continue;
          seen.add(c.filename);
          const li = document.createElement("li");
          const f = document.createElement("span"); f.className = "file"; f.textContent = c.filename;
          li.append(f, document.createTextNode(" — " + c.document_title));
          ul.appendChild(li);
        }
        wrap.appendChild(ul);
      }
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderThinking() {
      const t = document.createElement("div");
      t.className = "thinking"; t.id = "thinking-indicator";
      t.textContent = "thinking…";
      messagesEl.appendChild(t);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function removeThinking() {
      const t = document.getElementById("thinking-indicator");
      if (t) t.remove();
    }

    async function refreshHealth() {
      try {
        const r = await fetch(BACKEND + "/health");
        const j = await r.json();
        healthEl.textContent = `model: ${j.model} · db: ${j.db_ok ? "ok" : "down"} · water: ${j.water_type}`;
      } catch (e) {
        healthEl.textContent = "backend unreachable @ " + BACKEND;
        healthEl.classList.add("error");
      }
    }

    document.getElementById("composer").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const msg = inputEl.value.trim();
      if (!msg) return;
      renderMessage("user", msg);
      history.push({ role: "user", content: msg });
      inputEl.value = "";
      sendBtn.disabled = true;
      renderThinking();
      try {
        const r = await fetch(BACKEND + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg, history: history.slice(0, -1) }),
        });
        removeThinking();
        if (!r.ok) {
          const err = await r.text();
          renderMessage("assistant", "Error: " + err);
          return;
        }
        const j = await r.json();
        renderMessage("assistant", j.response, j.citations);
        history.push({ role: "assistant", content: j.response });
      } catch (e) {
        removeThinking();
        renderMessage("assistant", "Network error: " + e.message);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });

    refreshHealth();
  </script>
</body>
</html>
