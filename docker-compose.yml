services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cer_rag_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cleanearth
    ports:
      - "5432:5432"
    volumes:
      - cer_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cleanearth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cer_rag_pgdata:
